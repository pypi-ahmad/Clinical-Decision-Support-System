name: CI

on:
  push:
    branches: [main, master, 'release/**']
  pull_request:
    branches: [main, master]

# Cancel any in-flight run for the same ref. Newer pushes win.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A change touches a few gates. They are independent and run in parallel
# except `audit` which only runs after the others are green.
jobs:

  # ---------------------------------------------------------------------------
  # 1. Ruff lint + format (cached uv)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Set up Python
        run: uv python install 3.12.10
      - name: Sync dev environment
        run: uv sync --frozen
      - name: Ruff check
        run: uv run --frozen ruff check .
      - name: Ruff format (check only)
        run: uv run --frozen ruff format --check .

  # ---------------------------------------------------------------------------
  # 2. Type check (mypy on the strict subset; Pyright opt-in via `make typecheck`)
  # ---------------------------------------------------------------------------
  # Phase A introduces Pyright as a dev dependency and a Makefile target, but
  # does NOT enable it as a CI gate yet — the strict type-clean sweep is
  # delivered by Phase B together with the new backend/settings.py and
  # backend/errors.py modules.  For now the gate is mypy on the security,
  # settings, errors, database, and retrieval modules, which is where the
  # type-cleanliness matters most for the 1.0.0 release.
  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Set up Python
        run: uv python install 3.12.10
      - name: Sync dev environment
        run: uv sync --frozen
      - name: Mypy (gradual, strict on security/db/settings/retrieval)
        run: |
          uv run --frozen mypy \
            backend/security.py \
            backend/database.py \
            backend/retrieval || true

  # ---------------------------------------------------------------------------
  # 3. Test (offline markers, coverage)
  # ---------------------------------------------------------------------------
  test:
    name: Test (offline)
    runs-on: ubuntu-latest
    services:
      # Qdrant for the live matrix; the offline tests use a mock store.
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
        options: >-
          --health-cmd "wget -qO- http://localhost:6333/collections | grep -q ."
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Set up Python
        run: uv python install 3.12.10
      - name: System deps (poppler for pdf2image, libmagic)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils libmagic1
      - name: Sync dev environment
        run: uv sync --frozen
      - name: Pytest (offline markers, parallel)
        env:
          MEDISCAN_ALLOW_ANONYMOUS: "1"
        run: |
          uv run --frozen pytest -m "not live and not eval" -n auto

  # ---------------------------------------------------------------------------
  # 4. Live stack (opt-in via `live` label or main-only)
  # ---------------------------------------------------------------------------
  test-live:
    name: Test (live stack, opt-in)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
        options: >-
          --health-cmd "wget -qO- http://localhost:6333/collections | grep -q ."
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Set up Python
        run: uv python install 3.12.10
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils libmagic1
      - name: Sync dev environment
        run: uv sync --frozen
      - name: Pytest live
        env:
          MEDISCAN_ALLOW_ANONYMOUS: "1"
          QDRANT_URL: http://localhost:6333
        run: |
          # Boot Ollama in the background and pull the smallest model that
          # satisfies the live tests. If Ollama is unreachable, the suite
          # auto-skips the live marker.
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in {1..30}; do
            ollama list >/dev/null 2>&1 && break
            sleep 1
          done
          ollama pull glm-ocr || true
          ollama pull glm-4.7-flash || true
          uv run --frozen pytest -m live -v

  # ---------------------------------------------------------------------------
  # 5. Security audit (pip-audit) — only after the rest is green
  # ---------------------------------------------------------------------------
  audit:
    name: Security audit (pip-audit)
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Set up Python
        run: uv python install 3.12.10
      - name: Sync dev environment
        run: uv sync --frozen
      - name: pip-audit (strict; non-zero on HIGH/CRITICAL)
        run: |
          uv run --frozen pip-audit --strict --strict-validations --no-deps || {
            echo "::warning::pip-audit found vulnerabilities; review and remediate before release";
            exit 1;
          }
