name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff>=0.9,<0.10"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format (check only)
        run: ruff format --check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mypy + runtime deps
        run: |
          pip install "mypy>=1.14"
          pip install fastapi pydantic pydantic-settings structlog tenacity \
                      aiofiles httpx ollama openai anthropic \
                      google-genai langgraph qdrant-client pdf2image Pillow \
                      python-magic tenacity
      - name: Mypy (gradual, strict on core modules only)
        run: mypy backend/security.py backend/database.py backend/retrieval || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System deps (poppler for pdf2image)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils libmagic1
      - name: Install project deps
        run: |
          python -m pip install --upgrade pip
          # Install without the torch extra-index since the runner is CPU-only
          # and the CUDA wheels are large. Skip torch by using --no-deps tricks
          # or install a CPU torch explicitly if any test needs it.
          pip install --index-url https://pypi.org/simple \
            "fastapi>=0.115,<0.117" "pydantic>=2.9,<3.0" "pydantic-settings>=2.6,<3.0" \
            "uvicorn[standard]>=0.32,<0.35" "python-multipart>=0.0.18" \
            "aiofiles>=24.1.0" "httpx>=0.27.2,<0.29" \
            "tenacity>=9.0.0" "structlog>=24.4.0" "slowapi>=0.1.9" \
            "ollama>=0.4.4" "openai>=1.55,<2.0" "anthropic>=0.40,<1.0" \
            "google-genai>=0.8.0" "langgraph>=0.2.60" "qdrant-client>=1.12.1" \
            "pdf2image>=1.17.0" "Pillow>=11.0.1" "python-magic>=0.4.27" \
            "pytest>=8.3.3" "pytest-asyncio>=0.24.0" "pytest-cov>=5.0.0" \
            "requests>=2.32.3"
      - name: Run pytest (offline markers only)
        env:
          MEDISCAN_ALLOW_ANONYMOUS: "1"
        run: pytest -q -m "not live and not eval"

  audit:
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit --strict -r requirements.txt || true
