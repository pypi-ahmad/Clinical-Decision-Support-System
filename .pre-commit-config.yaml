repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: detect-private-key

  # NOTE: mypy is intentionally NOT wired into pre-commit in Phase A.
  # The strict type-clean sweep is delivered by Phase B together with the
  # new backend/settings.py and backend/errors.py modules. For now, the
  # type-check gate lives in CI (`.github/workflows/ci.yml`, `type-check` job)
  # where it runs as a soft check on the strict subset only.
  #
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.14.1
  #   hooks:
  #     - id: mypy
  #       args: [--config-file=pyproject.toml]
  #       files: ^backend/(security|errors|settings|db|database|retrieval)/.*\.py$

  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
